<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CSC尺规作图</title>
    <link rel="icon" type="image/svg+xml" href="favicon.svg">
    <link rel="stylesheet" href="css/style.css?v=7">
</head>
<body>
    <div class="app">
        <div class="canvas-wrapper">
        <!-- 左上：导入 / 导出 (图形数据 JSON) -->
        <div class="corner-panel top-left actions">
            <span class="brand-mark" title="CSC尺规作图 — Compass &amp; Straightedge Construction">
                <svg viewBox="0 0 64 64" width="33" height="33" aria-hidden="true">
                    <rect width="64" height="64" rx="13" fill="#10141d"/>
                    <path d="M13 34 L32 53 L51 34" fill="none" stroke="#eab308" stroke-width="5" stroke-linecap="round" stroke-linejoin="round"/>
                    <path d="M32 9 L17 50 M32 9 L47 50" fill="none" stroke="#7a9eff" stroke-width="5" stroke-linecap="round"/>
                    <circle cx="32" cy="8.5" r="3.6" fill="#7a9eff"/>
                    <path d="M16.5 38.5 L23.5 45.5 M40.5 45.5 L47.5 38.5" fill="none" stroke="#eab308" stroke-width="5" stroke-linecap="round"/>
                    <text x="32" y="40.5" font-family="Georgia, 'Times New Roman', serif" font-size="15" font-weight="bold" text-anchor="middle" fill="#f3f4f6">G</text>
                </svg>
            </span>
            <button class="action-btn small" id="importBtn" title="导入图形数据 (JSON 文件)">📂 导入</button>
            <button class="action-btn small" id="exportBtn" title="导出图形数据 (点线/填充/标注 → JSON 文件)">💾 导出</button>
            <input type="file" id="importFile" accept=".json,application/json" style="display:none">
        </div>
            <canvas id="board"></canvas>
            <div class="snap-indicator" id="snapIndicator">吸附</div>
            <div class="measure-result" id="measureResult" style="display:none"><span id="measureText"></span><button id="measureCloseBtn" title="关闭测距结果">×</button></div>
        </div>

        <!-- 右上：工具栏 (图标 + 中文) -->
        <div class="corner-panel top-right toolbar">
            <div class="tool-group">
                <button id="toolRuler" class="tool-btn active" data-tool="ruler" title="直尺: 点击起点 → 点击终点。可切线段/射线/直线，线段支持连续画线">
                    <span class="tool-ico">📏</span>
                    <span class="tool-label">画线</span>
                </button>

                <button id="toolCompass" class="tool-btn" data-tool="compass" title="圆规: 点击圆心 → 点击定半径。可切整圆/短弧(短弧=按下定起点拖拽松开落弧)，锁定后半径=最近测距值">
                    <span class="tool-ico">
                        <svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
                            <circle cx="12" cy="4.5" r="1.8"/>
                            <path d="M10.9 6.1 5.5 20"/>
                            <path d="M13.1 6.1 18.5 20"/>
                            <path d="M7.1 14.6a8.2 8.2 0 0 0 9.8 0"/>
                        </svg>
                    </span>
                    <span class="tool-label">画圆</span>
                </button>

                 <button id="toolPoint" class="tool-btn" data-tool="point" title="画点: 单击画布放置一个点 (可吸附到端点/交点/网格)">
                    <span class="tool-ico">
                        <svg viewBox="0 0 24 24" width="18" height="18" fill="currentColor" stroke="none" aria-hidden="true">
                            <circle cx="12" cy="12" r="4.5"/>
                        </svg>
                    </span>
                    <span class="tool-label">画点</span>
                </button>
                
                <button id="toolMeasure" class="tool-btn" data-tool="measure" title="测距: 点击起点 → 点击终点，距离显示在下方中间。结果可锁定为圆规半径">
                    <span class="tool-ico">
                        <svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
                            <circle cx="12" cy="3.5" r="1.7"/>
                            <path d="M10.9 5 5 20"/>
                            <path d="M13.1 5 19 20"/>
                            <path d="M7.5 13.5h9"/>
                            <path d="m9.2 11.6-1.9 1.9 1.9 1.9"/>
                            <path d="m14.8 11.6 1.9 1.9-1.9 1.9"/>
                        </svg>
                    </span>
                    <span class="tool-label">测距</span>
                </button>
             
                <button id="toolEraser" class="tool-btn" data-tool="eraser" title="橡皮: 悬浮线上拖动擦除该线；点击标注点单独删除该点">
                    <span class="tool-ico">
                        <svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
                            <path d="m7 21-4.3-4.3c-1-1-1-2.5 0-3.4l9.6-9.6c1-1 2.5-1 3.4 0l5.6 5.6c1 1 1 2.5 0 3.4L13 21"/>
                            <path d="M22 21H7"/>
                            <path d="m5 11 9 9"/>
                        </svg>
                    </span>
                    <span class="tool-label">擦除</span>
                </button>
                <button id="toolFill" class="tool-btn" data-tool="fill" title="填充: 点击封闭区域填色，色板可换颜色">
                    <span class="tool-ico">🪣</span>
                    <span class="tool-label">填充</span>
                </button>
                <button id="toolVertex" class="tool-btn" data-tool="vertex" title="标签: 点击节点命名；已命名点可改名，留空则删除">
                    <span class="tool-ico">🏷️</span>
                    <span class="tool-label">标记</span>
                </button>
               
            </div>
        </div>

        <!-- 工具栏下方右侧堆叠面板 (纵向)：
             第一行 = 填充色板 (fill) 或 实线/虚线 (ruler/compass)
             第二行 = 线段/射线/直线 (ruler) -->
        <div class="corner-panel ruler-kind-panel" id="rulerKindPanel">
            <div class="style-card" id="fillCard" title="填充颜色">
                <div class="swatch-grid" id="fillPalette">
                    <button class="swatch active" data-color="#ef4444" style="background:#ef4444" title="#ef4444"></button>
                    <button class="swatch" data-color="#f97316" style="background:#f97316" title="#f97316"></button>
                    <button class="swatch" data-color="#eab308" style="background:#eab308" title="#eab308"></button>
                    <button class="swatch" data-color="#22c55e" style="background:#22c55e" title="#22c55e"></button>
                    <button class="swatch" data-color="#06b6d4" style="background:#06b6d4" title="#06b6d4"></button>
                    <button class="swatch" data-color="#3b82f6" style="background:#3b82f6" title="#3b82f6"></button>
                    <button class="swatch" data-color="#a855f7" style="background:#a855f7" title="#a855f7"></button>
                    <button class="swatch" data-color="#ec4899" style="background:#ec4899" title="#ec4899"></button>
                    <button class="swatch swatch-transparent" data-color="transparent" title="透明 (取消填充)" aria-label="取消填充"></button>
                    <label class="swatch swatch-custom" title="自定义颜色">
                        <input type="color" id="customColor" value="#f97316">
                        <span class="swatch-custom-plus">+</span>
                    </label>
                </div>
            </div>
            <div class="style-card" id="lineStyleCard" title="线条样式">
                <div class="seg-group" id="lineStyleGroup">
                    <button class="seg-btn active" data-style="solid" title="实线">
                        <span class="seg-icon seg-solid"></span>
                        <span>实线</span>
                    </button>
                    <button class="seg-btn" data-style="dashed" title="虚线">
                        <span class="seg-icon seg-dashed"></span>
                        <span>虚线</span>
                    </button>
                </div>
            </div>
            <div class="tool-group sub" id="rulerKindGroup" title="直尺绘制模式">
                <button class="kind-btn active" data-kind="segment">线段</button>
                <button class="kind-btn" data-kind="ray">射线</button>
                <button class="kind-btn" data-kind="line">直线</button>
            </div>
            <div class="tool-group sub" id="compassKindGroup" title="圆规绘制模式" style="display:none">
                <button class="kind-btn active" data-ckind="circle">整圆</button>
                <button class="kind-btn" data-ckind="arc">短弧</button>
                <button class="kind-btn" id="compassLockBtn" title="锁定最近测距值为圆规半径" style="display:none">🔒 锁定半径</button>
            </div>
        </div>

        <!-- 左下：开关 (横平竖直 / 点线吸附 / 蓝图) -->
        <div class="corner-panel bottom-left toggles-only">
            <div class="status" id="statusMsg" style="display:none"></div>
            <label class="toggle-wrap" title="绘制时方向接近水平/垂直 (0.5°内) 自动吸附到轴线">
                <input type="checkbox" id="axisSnapToggle" checked>
                横平竖直
            </label>
            <label class="toggle-wrap" title="吸附到端点/交点/圆心/线上/圆周；关闭后仅保留网格与横平竖直吸附">
                <input type="checkbox" id="circleSnapToggle" checked>
                点线吸附
            </label>
            <label class="toggle-wrap" title="蓝图模式: 蓝底配色 + 网格显示与网格吸附；关闭后白底无网格">
                <input type="checkbox" id="blueprintToggle" checked>
                蓝图模式
            </label>
            <label class="toggle-wrap" title="隐藏所有点 (端点/圆心/交点) 及顶点标签，仅不显示，不影响吸附">
                <input type="checkbox" id="hidePointsToggle">
                隐藏点
            </label>
        </div>

        <!-- 右下：操作按钮 -->
        <div class="corner-panel bottom-right actions">
            <button class="action-btn small" id="resetViewBtn" title="重置视野">⟲ 重置</button>
            <button class="action-btn small" id="fullBtn" title="切换全屏">⛶ 全屏</button>
            <button id="undoBtn" class="action-btn undo small" title="撤销 (Ctrl+Z)">↶ 撤销</button>
            <button id="clearBtn" class="action-btn small" title="清空画布">🗑 清空</button>
        </div>

        <!-- 沉浸模式退出按钮 -->
        <button id="exitImmersiveBtn" class="immersive-exit" title="退出沉浸模式">⛶ 退出沉浸</button>
    </div>

    <!-- 脚本按依赖顺序加载 -->
    <script src="js/config.js?v=2"></script>
    <script src="js/geometry.js?v=1"></script>
    <script src="js/store.js?v=1"></script>
    <script src="js/view.js?v=1"></script>
    <script src="js/snap.js?v=1"></script>
    <script src="js/renderer.js?v=2"></script>
    <script src="js/tooltip.js?v=1"></script>
    <script src="js/app.js?v=2"></script>
</body>
</html>
